    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Fuera de Servicio | Café Leblon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0A0A0A;
            --surface: #141414;
            --border: #2A2A2A;
            --gold: #C9A962;
            --gold-light: #D4B97A;
            --text-primary: #FFFFFF;
            --text-secondary: #B8B0A0;
            --text-muted: #6A6A6A;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        a { text-decoration: none; color: inherit; }

        .grain {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            text-align: center;
            padding: 40px 24px;
            max-width: 520px;
            animation: fadeInUp 0.8s var(--ease) forwards;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
        }
        .icon-wrapper i {
            color: var(--gold);
            width: 36px;
            height: 36px;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--gold);
            margin-bottom: 40px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 40px;
            font-weight: 500;
            letter-spacing: -1px;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold);
            color: var(--bg);
            font-size: 14px;
            font-weight: 600;
            padding: 16px 36px;
            letter-spacing: 1px;
            transition: all 0.4s var(--ease);
        }
        .btn-back:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(201,169,98,0.3);
        }
        .btn-back i {
            width: 18px;
            height: 18px;
        }

        .footer-text {
            margin-top: 48px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            h1 { font-size: 32px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="grain"></div>

    <div class="container">
        <div class="logo">LEBLON</div>

        <div class="icon-wrapper">
            <i data-lucide="alert-triangle"></i>
        </div>

        <h1>Página Fuera de Servicio</h1>
        <p>Estamos trabajando para mejorar tu experiencia de compra. Por favor, intentá de nuevo más tarde.</p>

        <a href="index.html" class="btn-back">
            <i data-lucide="arrow-left"></i>
            <span>Volver al Inicio</span>
        </a>

        <div class="footer-text">&copy; 2026 Café Leblon. Todos los derechos reservados.</div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
